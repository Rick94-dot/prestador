<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Globo Terrestre Conectado</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000005;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
  // ============ CENA / CÂMERA / RENDER ============
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 3.2;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const EARTH_RADIUS = 1;

  // ============ LUZES ============
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
  sunLight.position.set(5, 2, 4);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x223344, 0.9));

  // ============ GRUPO DO MUNDO ============
  const worldGroup = new THREE.Group();
  worldGroup.rotation.z = THREE.MathUtils.degToRad(-8);
  scene.add(worldGroup);

  // ============ TEXTURAS REALISTAS ============
  const loader = new THREE.TextureLoader();
  const base = "https://threejs.org/examples/textures/planets/";
  const earthMap    = loader.load(base + "earth_atmos_2048.jpg");
  const earthNormal = loader.load(base + "earth_normal_2048.jpg");
  const earthSpec   = loader.load(base + "earth_specular_2048.jpg");
  const cloudsMap   = loader.load(base + "earth_clouds_1024.png");
  const lightsMap   = loader.load(base + "earth_lights_2048.png");

  // ============ TERRA ============
  const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthMap,
    normalMap: earthNormal,
    normalScale: new THREE.Vector2(0.8, 0.8),
    specularMap: earthSpec,
    specular: new THREE.Color(0x333333),
    shininess: 15,
    emissiveMap: lightsMap,
    emissive: new THREE.Color(0xffcc88),
    emissiveIntensity: 0.55
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  worldGroup.add(earth);

  // ============ NUVENS ============
  const cloudsGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.008, 96, 96);
  const cloudsMaterial = new THREE.MeshPhongMaterial({
    map: cloudsMap,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
  });
  const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
  worldGroup.add(clouds);

  // ============ ATMOSFERA SUTIL ============
  const atmosphereGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.04, 96, 96);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      glowColor: { value: new THREE.Color(0x3a7bd5) }
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      uniform vec3 glowColor;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
        gl_FragColor = vec4(glowColor, intensity * 0.9);
      }
    `
  });
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  scene.add(atmosphere);

  // ============ ESTRELAS ============
  function createStars() {
    const group = new THREE.Group();
    for (let layer = 0; layer < 3; layer++) {
      const geo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 40 + Math.random() * 40;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(p) * Math.cos(t);
        positions[i * 3 + 1] = r * Math.cos(p);
        positions[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      }
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.05 + layer * 0.05,
        transparent: true,
        opacity: 0.4 + layer * 0.25
      });
      group.add(new THREE.Points(geo, mat));
    }
    return group;
  }
  scene.add(createStars());

  // ============ LAT/LON -> 3D ============
  function latLonToVector3(lat, lon, radius) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  // ============ HUBS DE CONEXÃO ============
  const cities = {
    novaYork:   [40.7, -74.0],
    londres:    [51.5, -0.12],
    toquio:     [35.6, 139.7],
    saoPaulo:   [-23.5, -46.6],
    sydney:     [-33.8, 151.2],
    frankfurt:  [50.1, 8.68],
    singapura:  [1.35, 103.8],
    mumbai:     [19.0, 72.8],
    losAngeles: [34.0, -118.2],
    joanesburgo:[-26.2, 28.0]
  };

  const connections = [
    ["novaYork", "londres"],
    ["londres", "frankfurt"],
    ["frankfurt", "mumbai"],
    ["mumbai", "singapura"],
    ["singapura", "toquio"],
    ["singapura", "sydney"],
    ["toquio", "losAngeles"],
    ["losAngeles", "novaYork"],
    ["saoPaulo", "novaYork"],
    ["saoPaulo", "londres"],
    ["joanesburgo", "londres"],
    ["joanesburgo", "singapura"]
  ];

  // ============ MARCADORES DAS CIDADES ============
  const markerGroup = new THREE.Group();
  worldGroup.add(markerGroup);
  const markers = [];

  Object.values(cities).forEach((coords) => {
    const pos = latLonToVector3(coords[0], coords[1], EARTH_RADIUS * 1.005);

    const markerGeo = new THREE.SphereGeometry(0.008, 8, 8);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffd27f });
    const marker = new THREE.Mesh(markerGeo, markerMat);
    marker.position.copy(pos);
    markerGroup.add(marker);

    const ringGeo = new THREE.RingGeometry(0.01, 0.016, 24);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffd27f,
      transparent: true,
      opacity: 0.4,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(pos);
    ring.lookAt(pos.clone().multiplyScalar(2));
    markerGroup.add(ring);

    markers.push({ ring, phase: Math.random() * Math.PI * 2 });
  });

  // ============ ROTAS DE CONEXÃO ============
  // Cada rota tem:
  //  - uma linha base que "se desenha" do zero até o destino (animação de conexão)
  //  - depois de conectada, um pulso tipo cometa flui continuamente por ela
  const arcGroup = new THREE.Group();
  worldGroup.add(arcGroup);
  const arcsData = [];

  const SEGMENTS = 96;

  function createArc(startCoords, endCoords, index) {
    const start = latLonToVector3(startCoords[0], startCoords[1], EARTH_RADIUS * 1.005);
    const end = latLonToVector3(endCoords[0], endCoords[1], EARTH_RADIUS * 1.005);

    const distance = start.distanceTo(end);
    const mid = start.clone().add(end).multiplyScalar(0.5);
    mid.normalize().multiplyScalar(EARTH_RADIUS * (1.05 + distance * 0.18));

    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
    const points = curve.getPoints(SEGMENTS);

    // linha base (fica sutil e permanente depois de conectada)
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    geometry.setDrawRange(0, 0); // começa "desconectada"
    const material = new THREE.LineBasicMaterial({
      color: 0x7fc4ff,
      transparent: true,
      opacity: 0.28
    });
    const line = new THREE.Line(geometry, material);
    arcGroup.add(line);

    // ponto brilhante na "ponta" da linha enquanto ela se conecta
    const tipGeo = new THREE.SphereGeometry(0.012, 8, 8);
    const tipMat = new THREE.MeshBasicMaterial({
      color: 0xcfe9ff,
      transparent: true,
      opacity: 0
    });
    const tip = new THREE.Mesh(tipGeo, tipMat);
    arcGroup.add(tip);

    // cauda tipo cometa (fluxo contínuo após conectar)
    const tailCount = 5;
    const tailOffsets = [0, -0.02, -0.04, -0.06, -0.08];
    const tailOpacities = [1, 0.55, 0.32, 0.16, 0.06];
    const tailSizes = [0.011, 0.009, 0.007, 0.005, 0.004];
    const tail = tailOffsets.map((offset, i) => {
      const geo = new THREE.SphereGeometry(tailSizes[i], 6, 6);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xcfe9ff,
        transparent: true,
        opacity: 0
      });
      const mesh = new THREE.Mesh(geo, mat);
      arcGroup.add(mesh);
      return { mesh, offset, baseOpacity: tailOpacities[i] };
    });

    arcsData.push({
      curve,
      points,
      geometry,
      tip,
      tail,
      totalPoints: points.length,
      // animação de conexão: cada rota começa em um momento levemente diferente
      connectDelay: index * 0.35,
      connectDuration: 1.6,
      connected: false,
      flowT: Math.random(),
      flowSpeed: 0.05 + Math.random() * 0.05
    });
  }

  connections.forEach(([a, b], i) => createArc(cities[a], cities[b], i));

  // ============ RESPONSIVIDADE ============
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ ANIMAÇÃO ============
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    const delta = clock.getDelta();

    worldGroup.rotation.y += 0.0012;
    clouds.rotation.y += 0.0004;

    // anéis das cidades pulsando
    markers.forEach((m) => {
      const s = 1 + 0.25 * Math.sin(elapsed * 1.4 + m.phase);
      m.ring.scale.set(s, s, s);
      m.ring.material.opacity = 0.35 - 0.2 * Math.sin(elapsed * 1.4 + m.phase);
    });

    arcsData.forEach((arc) => {
      if (!arc.connected) {
        // ---- FASE 1: animação de "estabelecendo conexão" ----
        const localT = elapsed - arc.connectDelay;
        if (localT < 0) return; // ainda não começou

        const progress = Math.min(localT / arc.connectDuration, 1);
        const count = Math.floor(progress * arc.totalPoints);
        arc.geometry.setDrawRange(0, count);

        // ponta brilhante acompanhando o desenho da linha
        const idx = Math.min(count, arc.totalPoints - 1);
        arc.tip.position.copy(arc.points[idx]);
        arc.tip.material.opacity = progress < 1 ? 0.9 : 0;

        if (progress >= 1) {
          arc.connected = true;
        }
      } else {
        // ---- FASE 2: fluxo contínuo tipo cometa ----
        arc.flowT += delta * arc.flowSpeed;
        if (arc.flowT > 1.15) arc.flowT = -0.15; // some antes de reaparecer no início

        arc.tail.forEach((seg) => {
          const t = arc.flowT + seg.offset;
          if (t < 0 || t > 1) {
            seg.mesh.material.opacity = 0;
            return;
          }
          seg.mesh.position.copy(arc.curve.getPoint(t));
          // fade suave nas bordas do trajeto
          const edgeFade = Math.min(1, Math.min(t, 1 - t) * 12);
          seg.mesh.material.opacity = seg.baseOpacity * edgeFade;
        });
      }
    });

    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
