<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ÍCARO</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000005;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  canvas {
    display: block;
  }

  /* ============ OVERLAY CENTRAL ============ */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none; /* deixa o globo "respirar" atrás, só o card recebe clique */
  }

  #card {
    pointer-events: auto;
    width: min(90vw, 460px);
    max-height: 86vh;
    overflow-y: auto;
    padding: 40px 36px 34px;
    border-radius: 18px;
    background: rgba(8, 16, 28, 0.55);
    border: 1px solid rgba(127, 196, 255, 0.25);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 0 40px rgba(58, 123, 213, 0.15),
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    text-align: center;
    scrollbar-width: thin;
    scrollbar-color: rgba(127, 196, 255, 0.35) transparent;
  }

  #card::-webkit-scrollbar {
    width: 6px;
  }
  #card::-webkit-scrollbar-thumb {
    background: rgba(127, 196, 255, 0.35);
    border-radius: 3px;
  }

  #logo {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #eaf6ff;
    margin: 0 0 4px;
    text-shadow: 0 0 18px rgba(127, 196, 255, 0.55);
  }

  #subtitle {
    font-size: 12.5px;
    letter-spacing: 1.5px;
    color: #7fa8c9;
    margin: 0 0 30px;
    text-transform: uppercase;
  }

  #cnpj-label {
    display: block;
    text-align: left;
    font-size: 12.5px;
    color: #9fc3dd;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  #cnpj-input {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-radius: 10px;
    border: 1px solid rgba(127, 196, 255, 0.3);
    background: rgba(255, 255, 255, 0.04);
    color: #eaf6ff;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  #cnpj-input::placeholder {
    color: rgba(200, 225, 245, 0.35);
  }

  #cnpj-input:focus {
    border-color: rgba(127, 196, 255, 0.7);
    box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.2);
  }

  #cnpj-input.invalid {
    border-color: rgba(255, 99, 99, 0.6);
  }

  #cnpj-input.valid {
    border-color: rgba(110, 230, 180, 0.7);
  }

  #feedback {
    min-height: 18px;
    font-size: 12px;
    margin-top: 8px;
    text-align: left;
    color: rgba(255, 120, 120, 0.85);
    transition: color 0.2s ease;
  }

  #feedback.ok {
    color: rgba(110, 230, 180, 0.85);
  }

  #search-btn {
    width: 100%;
    margin-top: 22px;
    padding: 13px 14px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 10px;
    border: none;
    cursor: not-allowed;
    color: rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.06);
    transition: all 0.3s ease;
  }

  #search-btn.enabled {
    cursor: pointer;
    color: #04141f;
    background: linear-gradient(135deg, #7fc4ff, #3a7bd5);
    box-shadow: 0 0 22px rgba(58, 123, 213, 0.55);
  }

  #search-btn.enabled:hover {
    filter: brightness(1.08);
    box-shadow: 0 0 30px rgba(58, 123, 213, 0.75);
  }

  #search-btn.enabled:active {
    transform: scale(0.98);
  }

  /* ============ RESULTADOS ============ */
  #results {
    margin-top: 26px;
    text-align: left;
    display: none;
  }

  #results.visible {
    display: block;
  }

  #loading {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    font-size: 13px;
    color: #9fc3dd;
  }

  #loading.visible {
    display: flex;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(127, 196, 255, 0.25);
    border-top-color: #7fc4ff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .source-block {
    margin-bottom: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(127, 196, 255, 0.15);
  }

  .source-block:last-child {
    margin-bottom: 0;
  }

  .source-title {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #7fc4ff;
    margin: 0 0 10px;
  }

  .source-title.error {
    color: rgba(255, 120, 120, 0.85);
  }

  .data-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .data-row:last-child {
    border-bottom: none;
  }

  .data-label {
    color: #8fb3d1;
    white-space: nowrap;
  }

  .data-value {
    color: #eaf6ff;
    text-align: right;
    word-break: break-word;
  }

  .error-text {
    font-size: 12.5px;
    color: rgba(255, 150, 150, 0.85);
  }

  /* ============ BLOCO GOOGLE MAPS ============ */
  .google-block {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(127, 196, 255, 0.15);
  }

  .rating-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }

  .rating-score {
    font-size: 22px;
    font-weight: 700;
    color: #ffd76a;
  }

  .rating-count {
    font-size: 12.5px;
    color: #8fb3d1;
  }

  .open-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: auto;
  }

  .open-badge.open {
    background: rgba(110, 230, 180, 0.15);
    color: rgba(110, 230, 180, 0.9);
  }

  .open-badge.closed {
    background: rgba(255, 120, 120, 0.15);
    color: rgba(255, 120, 120, 0.9);
  }

  .hours-list {
    font-size: 12px;
    color: #cfe3f2;
    line-height: 1.7;
    margin: 8px 0;
    padding-left: 0;
    list-style: none;
  }

  .transport-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: #cfe3f2;
    margin-top: 10px;
  }

  .photos-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 12px;
    padding-bottom: 4px;
  }

  .photos-row img {
    height: 72px;
    width: 96px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid rgba(127, 196, 255, 0.2);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="overlay">
  <div id="card">
    <p id="logo">ÍCARO</p>
    <p id="subtitle">Score do Prestador</p>

    <label id="cnpj-label" for="cnpj-input">CNPJ</label>
    <input
      id="cnpj-input"
      type="text"
      inputmode="numeric"
      placeholder="00.000.000/0000-00"
      maxlength="18"
      autocomplete="off"
    />
    <div id="feedback"></div>

    <button id="search-btn" type="button" disabled>Buscar</button>

    <div id="loading">
      <div class="spinner"></div>
      <span>Consultando bases de dados...</span>
    </div>

    <div id="results"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
  // ============ CENA / CÂMERA / RENDER ============
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 3.2;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const EARTH_RADIUS = 1;

  // ============ LUZES ============
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
  sunLight.position.set(5, 2, 4);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x223344, 0.9));

  // ============ GRUPO DO MUNDO ============
  const worldGroup = new THREE.Group();
  worldGroup.rotation.z = THREE.MathUtils.degToRad(-8);
  scene.add(worldGroup);

  // ============ TEXTURAS REALISTAS ============
  const loader = new THREE.TextureLoader();
  const base = "https://threejs.org/examples/textures/planets/";
  const earthMap    = loader.load(base + "earth_atmos_2048.jpg");
  const earthNormal = loader.load(base + "earth_normal_2048.jpg");
  const earthSpec   = loader.load(base + "earth_specular_2048.jpg");
  const cloudsMap   = loader.load(base + "earth_clouds_1024.png");
  const lightsMap   = loader.load(base + "earth_lights_2048.png");

  // ============ TERRA ============
  const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthMap,
    normalMap: earthNormal,
    normalScale: new THREE.Vector2(0.8, 0.8),
    specularMap: earthSpec,
    specular: new THREE.Color(0x333333),
    shininess: 15,
    emissiveMap: lightsMap,
    emissive: new THREE.Color(0xffcc88),
    emissiveIntensity: 0.55
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  worldGroup.add(earth);

  // ============ NUVENS ============
  const cloudsGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.008, 96, 96);
  const cloudsMaterial = new THREE.MeshPhongMaterial({
    map: cloudsMap,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
  });
  const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
  worldGroup.add(clouds);

  // ============ ATMOSFERA SUTIL ============
  const atmosphereGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.04, 96, 96);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      glowColor: { value: new THREE.Color(0x3a7bd5) }
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      uniform vec3 glowColor;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
        gl_FragColor = vec4(glowColor, intensity * 0.9);
      }
    `
  });
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  scene.add(atmosphere);

  // ============ ESTRELAS ============
  function createStars() {
    const group = new THREE.Group();
    for (let layer = 0; layer < 3; layer++) {
      const geo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 40 + Math.random() * 40;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(p) * Math.cos(t);
        positions[i * 3 + 1] = r * Math.cos(p);
        positions[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      }
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.05 + layer * 0.05,
        transparent: true,
        opacity: 0.4 + layer * 0.25
      });
      group.add(new THREE.Points(geo, mat));
    }
    return group;
  }
  scene.add(createStars());

  // ============ RESPONSIVIDADE ============
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ ANIMAÇÃO ============
  function animate() {
    requestAnimationFrame(animate);
    worldGroup.rotation.y += 0.0012;
    clouds.rotation.y += 0.0004;
    renderer.render(scene, camera);
  }
  animate();
</script>

<script>
  // ============ FORMULÁRIO DE CNPJ ============
  const input = document.getElementById("cnpj-input");
  const feedback = document.getElementById("feedback");
  const button = document.getElementById("search-btn");

  // aplica a máscara 00.000.000/0000-00 enquanto o usuário digita
  function maskCNPJ(value) {
    const digits = value.replace(/\D/g, "").slice(0, 14);
    let masked = digits;

    masked = masked.replace(/^(\d{2})(\d)/, "$1.$2");
    masked = masked.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
    masked = masked.replace(/^(\d{2})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3/$4");
    masked = masked.replace(/^(\d{2})\.(\d{3})\.(\d{3})\/(\d{4})(\d)/, "$1.$2.$3/$4-$5");

    return masked;
  }

  // valida os dígitos verificadores do CNPJ (algoritmo módulo 11 oficial)
  function isValidCNPJ(rawValue) {
    const cnpj = rawValue.replace(/\D/g, "");

    if (cnpj.length !== 14) return false;
    if (/^(\d)\1{13}$/.test(cnpj)) return false; // rejeita sequências tipo 11111111111111

    const calcCheckDigit = (base) => {
      const weights = base.length === 12
        ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
        : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];

      const sum = base
        .split("")
        .reduce((acc, digit, i) => acc + parseInt(digit, 10) * weights[i], 0);

      const remainder = sum % 11;
      return remainder < 2 ? 0 : 11 - remainder;
    };

    const base12 = cnpj.slice(0, 12);
    const digit1 = calcCheckDigit(base12);
    const digit2 = calcCheckDigit(base12 + digit1);

    return cnpj === base12 + String(digit1) + String(digit2);
  }

  function updateState() {
    const raw = input.value.replace(/\D/g, "");

    if (raw.length === 0) {
      feedback.textContent = "";
      feedback.classList.remove("ok");
      input.classList.remove("valid", "invalid");
      setButtonEnabled(false);
      return;
    }

    if (raw.length < 14) {
      feedback.textContent = "CNPJ incompleto";
      feedback.classList.remove("ok");
      input.classList.remove("valid");
      input.classList.add("invalid");
      setButtonEnabled(false);
      return;
    }

    if (isValidCNPJ(raw)) {
      feedback.textContent = "CNPJ válido";
      feedback.classList.add("ok");
      input.classList.remove("invalid");
      input.classList.add("valid");
      setButtonEnabled(true);
    } else {
      feedback.textContent = "CNPJ inválido";
      feedback.classList.remove("ok");
      input.classList.remove("valid");
      input.classList.add("invalid");
      setButtonEnabled(false);
    }
  }

  function setButtonEnabled(enabled) {
    button.disabled = !enabled;
    button.classList.toggle("enabled", enabled);
  }

  input.addEventListener("input", (e) => {
    const cursorAtEnd = e.target.selectionStart === e.target.value.length;
    e.target.value = maskCNPJ(e.target.value);
    if (cursorAtEnd) {
      e.target.selectionStart = e.target.selectionEnd = e.target.value.length;
    }
    updateState();
  });

  // ============ CONFIGURAÇÃO DO BACKEND ============
  // Troque pela URL do seu serviço no Render depois do deploy, ex.:
  // const API_BASE_URL = "https://icaro-backend.onrender.com";
  const API_BASE_URL = "https://prestador-backend.onrender.com";

  const loadingEl = document.getElementById("loading");
  const resultsEl = document.getElementById("results");

  button.addEventListener("click", async () => {
    if (button.disabled) return;

    const cnpjDigits = input.value.replace(/\D/g, "");

    resultsEl.classList.remove("visible");
    resultsEl.innerHTML = "";
    loadingEl.classList.add("visible");
    setButtonEnabled(false);

    const [minhaReceita, brasilApi] = await Promise.allSettled([
      fetchMinhaReceita(cnpjDigits),
      fetchBrasilAPI(cnpjDigits)
    ]);

    loadingEl.classList.remove("visible");
    setButtonEnabled(true);

    const merged = renderResults(minhaReceita, brasilApi);

    // com o nome e endereço em mãos, busca os dados do Google Maps
    if (merged.nomeParaBusca && merged.enderecoParaBusca) {
      await buscarGooglePlaces(merged.nomeParaBusca, merged.enderecoParaBusca);
    }
  });

  async function buscarGooglePlaces(nome, endereco) {
    const googleBlock = document.createElement("div");
    googleBlock.className = "google-block";
    googleBlock.innerHTML = `<p class="source-title">Google Maps</p><p class="error-text" style="color:#8fb3d1;">Buscando dados do Google...</p>`;
    resultsEl.appendChild(googleBlock);

    try {
      const url = `${API_BASE_URL}/api/google-places?nome=${encodeURIComponent(nome)}&endereco=${encodeURIComponent(endereco)}`;
      const response = await fetch(url);
      const data = await response.json();

      if (!response.ok || !data.encontrado) {
        throw new Error(data.error || "Estabelecimento não encontrado no Google.");
      }

      renderGoogleBlock(googleBlock, data);
    } catch (err) {
      googleBlock.innerHTML = `
        <p class="source-title error">Google Maps</p>
        <p class="error-text">Não foi possível encontrar este estabelecimento no Google Maps.</p>
      `;
    }
  }

  function renderGoogleBlock(container, data) {
    const rating = data.nota != null ? data.nota.toFixed(1) : "—";
    const totalAvaliacoes = data.totalAvaliacoes != null ? `${data.totalAvaliacoes} avaliações` : "sem avaliações";

    let openBadge = "";
    if (data.abertoAgora === true) openBadge = `<span class="open-badge open">Aberto agora</span>`;
    else if (data.abertoAgora === false) openBadge = `<span class="open-badge closed">Fechado agora</span>`;

    const hoursHtml = data.horarioFuncionamento?.length
      ? `<ul class="hours-list">${data.horarioFuncionamento.map((line) => `<li>${line}</li>`).join("")}</ul>`
      : `<p class="error-text" style="color:#8fb3d1;">Horário não informado</p>`;

    const transporteLabel = (valor, label) =>
      valor === null ? `${label}: indisponível` : `${label}: ${valor}`;

    const photosHtml = data.fotos?.length
      ? `<div class="photos-row">${data.fotos.map((f) => `<img src="${API_BASE_URL}${f.url}" loading="lazy" alt="Foto do estabelecimento" />`).join("")}</div>`
      : "";

    container.innerHTML = `
      <p class="source-title">Google Maps</p>
      <div class="rating-row">
        <span class="rating-score">${rating} ★</span>
        <span class="rating-count">${totalAvaliacoes}</span>
        ${openBadge}
      </div>
      ${hoursHtml}
      <div class="transport-row">
        <span>🚌 ${transporteLabel(data.transporte.pontosOnibus, "Ônibus")}</span>
        <span>🚆 ${transporteLabel(data.transporte.estacoesTrem, "Trem")}</span>
        <span>🚇 ${transporteLabel(data.transporte.estacoesMetro, "Metrô")}</span>
      </div>
      ${photosHtml}
    `;
  }

  async function fetchMinhaReceita(cnpj) {
    const response = await fetch(`${API_BASE_URL}/api/minha-receita/${cnpj}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  async function fetchBrasilAPI(cnpj) {
    const response = await fetch(`${API_BASE_URL}/api/brasil-api/${cnpj}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function renderResults(minhaReceitaResult, brasilApiResult) {
    const mr = minhaReceitaResult.status === "fulfilled" ? normalizeMinhaReceita(minhaReceitaResult.value) : {};
    const ba = brasilApiResult.status === "fulfilled" ? normalizeBrasilAPI(brasilApiResult.value) : {};

    // pega o primeiro valor não vazio entre as duas fontes, nessa ordem de prioridade
    const pick = (key) => {
      const v1 = mr[key];
      const v2 = ba[key];
      if (v1 !== undefined && v1 !== null && String(v1).trim() !== "") return v1;
      if (v2 !== undefined && v2 !== null && String(v2).trim() !== "") return v2;
      return "Não localizado";
    };

    const fields = [
      ["Razão social", pick("razaoSocial")],
      ["Nome fantasia", pick("nomeFantasia")],
      ["Situação cadastral", pick("situacaoCadastral")],
      ["Atividade principal", pick("atividadePrincipal")],
      ["Endereço", pick("endereco")],
      ["CEP", formatCEP(pick("cep"))],
      ["Telefone", formatPhone(pick("telefone"))],
      ["E-mail", pick("email")]
    ];

    resultsEl.innerHTML = "";

    const block = document.createElement("div");
    block.className = "source-block";

    fields.forEach(([label, value]) => {
      const row = document.createElement("div");
      row.className = "data-row";
      row.innerHTML = `
        <span class="data-label">${label}</span>
        <span class="data-value">${value}</span>
      `;
      block.appendChild(row);
    });

    resultsEl.appendChild(block);
    resultsEl.classList.add("visible");

    return {
      nomeParaBusca: fields[1][1] !== "Não localizado" ? fields[1][1] : fields[0][1], // prefere nome fantasia, cai pro razão social
      enderecoParaBusca: fields[4][1] !== "Não localizado" ? fields[4][1] : ""
    };
  }

  // organiza os campos que vêm da API MinhaReceita em um formato comum
  function normalizeMinhaReceita(d) {
    return {
      razaoSocial: d.razao_social,
      nomeFantasia: d.nome_fantasia,
      situacaoCadastral: d.descricao_situacao_cadastral,
      atividadePrincipal: d.cnae_fiscal_descricao,
      endereco: formatEndereco(d.logradouro, d.numero, d.municipio, d.uf),
      cep: d.cep,
      telefone: d.ddd_telefone_1,
      email: d.email
    };
  }

  // organiza os campos que vêm da BrasilAPI em um formato comum
  function normalizeBrasilAPI(d) {
    return {
      razaoSocial: d.razao_social,
      nomeFantasia: d.nome_fantasia,
      situacaoCadastral: d.descricao_situacao_cadastral,
      atividadePrincipal: d.cnae_fiscal_descricao,
      endereco: formatEndereco(d.logradouro, d.numero, d.municipio, d.uf),
      cep: d.cep,
      telefone: d.ddd_telefone_1,
      email: d.email
    };
  }

  function formatEndereco(logradouro, numero, municipio, uf) {
    const parts = [
      [logradouro, numero].filter(Boolean).join(", "),
      [municipio, uf].filter(Boolean).join(" - ")
    ].filter(Boolean);
    return parts.join(" · ");
  }

  // formata CEP como 00000-000
  function formatCEP(value) {
    if (!value || value === "Não localizado") return value;
    const digits = String(value).replace(/\D/g, "");
    if (digits.length !== 8) return value;
    return `${digits.slice(0, 5)}-${digits.slice(5)}`;
  }

  // formata telefone como (XX)XXXXX-XXXX (celular, 11 dígitos)
  // ou (XX)XXXX-XXXX (fixo, 10 dígitos)
  function formatPhone(value) {
    if (!value || value === "Não localizado") return value;
    const digits = String(value).replace(/\D/g, "");

    if (digits.length === 11) {
      return `(${digits.slice(0, 2)})${digits.slice(2, 7)}-${digits.slice(7)}`;
    }
    if (digits.length === 10) {
      return `(${digits.slice(0, 2)})${digits.slice(2, 6)}-${digits.slice(6)}`;
    }
    return value;
  }
</script>
