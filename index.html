<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Globo Terrestre Conectado</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000005;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
  // ============ CENA / CÂMERA / RENDER ============
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 3.2;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const EARTH_RADIUS = 1;

  // ============ LUZES (sol de um lado, como na realidade) ============
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
  sunLight.position.set(5, 2, 4);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x223344, 0.9));

  // ============ GRUPO DO MUNDO ============
  const worldGroup = new THREE.Group();
  worldGroup.rotation.z = THREE.MathUtils.degToRad(-8); // leve inclinação do eixo
  scene.add(worldGroup);

  // ============ TEXTURAS REALISTAS ============
  const loader = new THREE.TextureLoader();
  const base = "https://threejs.org/examples/textures/planets/";
  const earthMap    = loader.load(base + "earth_atmos_2048.jpg");
  const earthNormal = loader.load(base + "earth_normal_2048.jpg");
  const earthSpec   = loader.load(base + "earth_specular_2048.jpg");
  const cloudsMap   = loader.load(base + "earth_clouds_1024.png");
  const lightsMap   = loader.load(base + "earth_lights_2048.png");

  // ============ TERRA (sem tinte artificial, cores naturais) ============
  const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthMap,
    normalMap: earthNormal,
    normalScale: new THREE.Vector2(0.8, 0.8),
    specularMap: earthSpec,       // oceanos refletem, continentes não
    specular: new THREE.Color(0x333333),
    shininess: 15,
    emissiveMap: lightsMap,       // luzes das cidades no lado noturno
    emissive: new THREE.Color(0xffcc88),
    emissiveIntensity: 0.55
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  worldGroup.add(earth);

  // ============ NUVENS (camada separada, gira um pouco mais rápido) ============
  const cloudsGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.008, 96, 96);
  const cloudsMaterial = new THREE.MeshPhongMaterial({
    map: cloudsMap,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
  });
  const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
  worldGroup.add(clouds);

  // ============ ATMOSFERA SUTIL (azul fino no limbo, como fotos da ISS) ============
  const atmosphereGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.04, 96, 96);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      glowColor: { value: new THREE.Color(0x3a7bd5) }
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      uniform vec3 glowColor;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
        gl_FragColor = vec4(glowColor, intensity * 0.9);
      }
    `
  });
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  scene.add(atmosphere);

  // ============ ESTRELAS (tamanhos e brilhos variados) ============
  function createStars() {
    const group = new THREE.Group();
    for (let layer = 0; layer < 3; layer++) {
      const geo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        // distribui em esfera distante, evitando aglomerar no centro
        const r = 40 + Math.random() * 40;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(p) * Math.cos(t);
        positions[i * 3 + 1] = r * Math.cos(p);
        positions[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      }
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.05 + layer * 0.05,
        transparent: true,
        opacity: 0.4 + layer * 0.25
      });
      group.add(new THREE.Points(geo, mat));
    }
    return group;
  }
  scene.add(createStars());

  // ============ LAT/LON -> 3D ============
  function latLonToVector3(lat, lon, radius) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  // ============ HUBS DE CONEXÃO (grandes centros reais) ============
  const cities = {
    novaYork:   [40.7, -74.0],
    londres:    [51.5, -0.12],
    toquio:     [35.6, 139.7],
    saoPaulo:   [-23.5, -46.6],
    sydney:     [-33.8, 151.2],
    frankfurt:  [50.1, 8.68],
    singapura:  [1.35, 103.8],
    mumbai:     [19.0, 72.8],
    losAngeles: [34.0, -118.2],
    joanesburgo:[-26.2, 28.0]
  };

  // rotas parecidas com cabos submarinos / tráfego real
  const connections = [
    ["novaYork", "londres"],
    ["londres", "frankfurt"],
    ["frankfurt", "mumbai"],
    ["mumbai", "singapura"],
    ["singapura", "toquio"],
    ["singapura", "sydney"],
    ["toquio", "losAngeles"],
    ["losAngeles", "novaYork"],
    ["saoPaulo", "novaYork"],
    ["saoPaulo", "londres"],
    ["joanesburgo", "londres"],
    ["joanesburgo", "singapura"]
  ];

  // ============ MARCADORES DISCRETOS ============
  const markerGroup = new THREE.Group();
  worldGroup.add(markerGroup);
  const markers = [];

  Object.values(cities).forEach((coords) => {
    const pos = latLonToVector3(coords[0], coords[1], EARTH_RADIUS * 1.005);

    const markerGeo = new THREE.SphereGeometry(0.008, 8, 8);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffd27f });
    const marker = new THREE.Mesh(markerGeo, markerMat);
    marker.position.copy(pos);
    markerGroup.add(marker);

    const ringGeo = new THREE.RingGeometry(0.01, 0.016, 24);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffd27f,
      transparent: true,
      opacity: 0.4,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(pos);
    ring.lookAt(pos.clone().multiplyScalar(2));
    markerGroup.add(ring);

    markers.push({ ring, phase: Math.random() * Math.PI * 2, pos });
  });

  // ============ ARCOS SUTIS (rotas de dados) ============
  const arcGroup = new THREE.Group();
  worldGroup.add(arcGroup);
  const arcsData = [];

  function createArc(startCoords, endCoords) {
    const start = latLonToVector3(startCoords[0], startCoords[1], EARTH_RADIUS * 1.005);
    const end = latLonToVector3(endCoords[0], endCoords[1], EARTH_RADIUS * 1.005);

    const distance = start.distanceTo(end);
    const mid = start.clone().add(end).multiplyScalar(0.5);
    // arcos mais baixos = mais realista (como rotas de voo)
    mid.normalize().multiplyScalar(EARTH_RADIUS * (1.05 + distance * 0.18));

    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
    const points = curve.getPoints(64);
    const geometry = new THREE.BufferGeometry().setFromPoints(points);

    const material = new THREE.LineBasicMaterial({
      color: 0x7fc4ff,
      transparent: true,
      opacity: 0.18
    });
    arcGroup.add(new THREE.Line(geometry, material));

    // pequeno pulso de luz percorrendo a rota
    const pulseGeo = new THREE.SphereGeometry(0.007, 6, 6);
    const pulseMat = new THREE.MeshBasicMaterial({
      color: 0xcfe9ff,
      transparent: true,
      opacity: 0.9
    });
    const pulse = new THREE.Mesh(pulseGeo, pulseMat);
    arcGroup.add(pulse);

    arcsData.push({ curve, pulse, t: Math.random(), speed: 0.08 + Math.random() * 0.08 });
  }

  connections.forEach(([a, b]) => createArc(cities[a], cities[b]));

  // ============ ÍCONES: SOBEM DAS CIDADES E DESAPARECEM ============
  // Em vez de orbitar aleatoriamente, cada ícone "nasce" em um hub,
  // sobe devagar como um sinal sendo emitido, e some. Depois renasce em outro hub.
  function makeIconSprite(symbol) {
    const size = 128;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.shadowColor = "rgba(180, 220, 255, 0.9)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "rgba(220, 240, 255, 0.95)";
    ctx.font = "600 64px 'Segoe UI Symbol', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(symbol, size / 2, size / 2);

    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(0.11, 0.11, 1);
    return sprite;
  }

  const iconSymbols = ["📡", "🛰", "🔒", "⚡", "🌐", "💾"];
  const emitters = [];
  const cityList = Object.values(cities);

  function resetEmitter(e, first = false) {
    const coords = cityList[Math.floor(Math.random() * cityList.length)];
    e.origin = latLonToVector3(coords[0], coords[1], EARTH_RADIUS * 1.01);
    e.dir = e.origin.clone().normalize(); // sobe na direção "para fora" da Terra
    e.progress = first ? Math.random() : 0; // desincroniza no início
    e.speed = 0.06 + Math.random() * 0.05;
    e.maxHeight = 0.35 + Math.random() * 0.2;
  }

  const EMITTER_COUNT = 7;
  for (let i = 0; i < EMITTER_COUNT; i++) {
    const sprite = makeIconSprite(iconSymbols[i % iconSymbols.length]);
    worldGroup.add(sprite); // dentro do worldGroup: acompanha a rotação, nasce da cidade certa
    const e = { sprite };
    resetEmitter(e, true);
    emitters.push(e);
  }

  // ============ RESPONSIVIDADE ============
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ ANIMAÇÃO ============
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    const delta = clock.getDelta();

    // rotação lenta da Terra; nuvens giram um pouco mais rápido
    worldGroup.rotation.y += 0.0012;
    clouds.rotation.y += 0.0004;

    // anéis das cidades pulsam devagar
    markers.forEach((m) => {
      const s = 1 + 0.25 * Math.sin(elapsed * 1.4 + m.phase);
      m.ring.scale.set(s, s, s);
      m.ring.material.opacity = 0.35 - 0.2 * Math.sin(elapsed * 1.4 + m.phase);
    });

    // pulsos percorrendo as rotas
    arcsData.forEach((arc) => {
      arc.t += delta * arc.speed;
      if (arc.t > 1) arc.t = 0;
      arc.pulse.position.copy(arc.curve.getPoint(arc.t));
      // fade nas pontas para não "piscar"
      const edge = Math.min(arc.t, 1 - arc.t);
      arc.pulse.material.opacity = Math.min(1, edge * 8) * 0.9;
    });

    // ícones sobem das cidades, fade in/out, renascem em outro hub
    emitters.forEach((e) => {
      e.progress += delta * e.speed;
      if (e.progress >= 1) resetEmitter(e);

      const height = e.progress * e.maxHeight;
      e.sprite.position.copy(e.origin).addScaledVector(e.dir, height);

      // opacidade: aparece suave, some suave
      let opacity;
      if (e.progress < 0.2)      opacity = e.progress / 0.2;
      else if (e.progress > 0.7) opacity = (1 - e.progress) / 0.3;
      else                       opacity = 1;
      e.sprite.material.opacity = opacity * 0.85;
    });

    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
