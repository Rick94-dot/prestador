<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ÍCARO</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000005;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  canvas {
    display: block;
  }

  /* ============ OVERLAY CENTRAL ============ */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none; /* deixa o globo "respirar" atrás, só o card recebe clique */
  }

  #card {
    pointer-events: auto;
    width: min(92vw, 560px);
    max-height: 86vh;
    overflow-y: auto;
    padding: 40px 36px 34px;
    border-radius: 18px;
    background: rgba(8, 16, 28, 0.55);
    border: 1px solid rgba(127, 196, 255, 0.25);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 0 40px rgba(58, 123, 213, 0.15),
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    text-align: center;
    scrollbar-width: thin;
    scrollbar-color: rgba(127, 196, 255, 0.35) transparent;
  }

  #card::-webkit-scrollbar {
    width: 6px;
  }
  #card::-webkit-scrollbar-thumb {
    background: rgba(127, 196, 255, 0.35);
    border-radius: 3px;
  }

  #logo {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #eaf6ff;
    margin: 0 0 4px;
    text-shadow: 0 0 18px rgba(127, 196, 255, 0.55);
  }

  #subtitle {
    font-size: 12.5px;
    letter-spacing: 1.5px;
    color: #7fa8c9;
    margin: 0 0 30px;
    text-transform: uppercase;
  }

  #cnpj-label {
    display: block;
    text-align: left;
    font-size: 12.5px;
    color: #9fc3dd;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  #cnpj-input {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-radius: 10px;
    border: 1px solid rgba(127, 196, 255, 0.3);
    background: rgba(255, 255, 255, 0.04);
    color: #eaf6ff;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  #cnpj-input::placeholder {
    color: rgba(200, 225, 245, 0.35);
  }

  #cnpj-input:focus {
    border-color: rgba(127, 196, 255, 0.7);
    box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.2);
  }

  #cnpj-input.invalid {
    border-color: rgba(255, 99, 99, 0.6);
  }

  #cnpj-input.valid {
    border-color: rgba(110, 230, 180, 0.7);
  }

  #feedback {
    min-height: 18px;
    font-size: 12px;
    margin-top: 8px;
    text-align: left;
    color: rgba(255, 120, 120, 0.85);
    transition: color 0.2s ease;
  }

  #feedback.ok {
    color: rgba(110, 230, 180, 0.85);
  }

  #search-btn {
    width: 100%;
    margin-top: 22px;
    padding: 13px 14px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 10px;
    border: none;
    cursor: not-allowed;
    color: rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.06);
    transition: all 0.3s ease;
  }

  #search-btn.enabled {
    cursor: pointer;
    color: #04141f;
    background: linear-gradient(135deg, #7fc4ff, #3a7bd5);
    box-shadow: 0 0 22px rgba(58, 123, 213, 0.55);
  }

  #search-btn.enabled:hover {
    filter: brightness(1.08);
    box-shadow: 0 0 30px rgba(58, 123, 213, 0.75);
  }

  #search-btn.enabled:active {
    transform: scale(0.98);
  }

  /* ============ RESULTADOS ============ */
  #results {
    margin-top: 26px;
    text-align: left;
    display: none;
  }

  #results.visible {
    display: block;
  }

  #loading {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    font-size: 13px;
    color: #9fc3dd;
  }

  #loading.visible {
    display: flex;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(127, 196, 255, 0.25);
    border-top-color: #7fc4ff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .source-block {
    margin-bottom: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(127, 196, 255, 0.15);
  }

  .source-block:last-child {
    margin-bottom: 0;
  }

  .source-title {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #7fc4ff;
    margin: 0 0 10px;
  }

  .source-title.error {
    color: rgba(255, 120, 120, 0.85);
  }

  .data-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .data-row:last-child {
    border-bottom: none;
  }

  .data-label {
    color: #8fb3d1;
    white-space: nowrap;
  }

  .data-value {
    color: #eaf6ff;
    text-align: right;
    word-break: break-word;
  }

  .error-text {
    font-size: 12.5px;
    color: rgba(255, 150, 150, 0.85);
  }

  /* ============ BLOCO GOOGLE MAPS ============ */
  .google-block {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(127, 196, 255, 0.15);
  }

  .google-match {
    font-size: 11.5px;
    color: #7a94a8;
    margin: -8px 0 14px;
  }

  .rating-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .rating-score {
    font-size: 22px;
    font-weight: 700;
    color: #ffd76a;
  }

  .rating-count {
    font-size: 12.5px;
    color: #8fb3d1;
  }

  .open-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    margin-left: auto;
  }

  .open-badge.open {
    background: rgba(110, 230, 180, 0.15);
    color: rgba(110, 230, 180, 0.9);
  }

  .open-badge.closed {
    background: rgba(255, 120, 120, 0.15);
    color: rgba(255, 120, 120, 0.9);
  }

  .hours-title {
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #8fb3d1;
    margin: 0 0 6px;
  }

  .hours-list {
    margin: 0 0 4px;
    padding: 0;
    list-style: none;
  }

  .hours-list li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12.5px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .hours-list li:last-child {
    border-bottom: none;
  }

  .hours-list .day-name {
    color: #b9d7ef;
    text-transform: capitalize;
    white-space: nowrap;
  }

  .hours-list .day-hours {
    color: #ffffff;
    font-weight: 500;
    text-align: right;
  }

  .hours-list li.today .day-name,
  .hours-list li.today .day-hours {
    color: #7fc4ff;
    font-weight: 600;
  }

  .hours-list .closed-text {
    color: rgba(255, 150, 150, 0.75);
  }

  .transport-title {
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #8fb3d1;
    margin: 14px 0 8px;
  }

  .transport-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .transport-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 20px;
    background: rgba(127, 196, 255, 0.08);
    border: 1px solid rgba(127, 196, 255, 0.18);
    color: #cfe3f2;
  }

  .transport-badge .count {
    font-weight: 700;
    color: #eaf6ff;
  }

  .accessibility-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 20px;
    background: rgba(127, 196, 255, 0.08);
    border: 1px solid rgba(127, 196, 255, 0.18);
    color: #cfe3f2;
  }

  .accessibility-badge.yes {
    color: rgba(110, 230, 180, 0.9);
    border-color: rgba(110, 230, 180, 0.3);
  }

  .accessibility-badge.no {
    color: rgba(255, 150, 150, 0.85);
    border-color: rgba(255, 120, 120, 0.25);
  }

  .accessibility-badge.unknown {
    color: #7a94a8;
  }

  .photos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }

  .photo-card {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .photo-card a {
    display: block;
  }

  .photo-card img {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid rgba(127, 196, 255, 0.2);
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .photo-card img:hover {
    transform: scale(1.03);
    border-color: rgba(127, 196, 255, 0.5);
  }

  .photo-error {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 90px;
    width: 100%;
    font-size: 10.5px;
    text-align: center;
    color: rgba(255, 150, 150, 0.85);
    background: rgba(255, 255, 255, 0.03);
    border: 1px dashed rgba(255, 120, 120, 0.3);
    border-radius: 8px;
    padding: 4px;
  }

  .photo-tag {
    align-self: flex-start;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(127, 196, 255, 0.12);
    color: #7fc4ff;
  }

  .photo-caption {
    font-size: 11px;
    color: #b9d7ef;
    line-height: 1.4;
    margin: 0;
  }

  /* ============ AVALIAÇÕES E RESUMO DA IA ============ */
  .ai-summary-box {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(127, 196, 255, 0.06);
    border: 1px solid rgba(127, 196, 255, 0.2);
  }

  .ai-summary-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #7fc4ff;
    margin: 0 0 8px;
  }

  .ai-summary-text {
    font-size: 12.5px;
    color: #eaf6ff;
    line-height: 1.5;
    margin: 0 0 10px;
  }

  .ai-summary-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .ai-summary-columns h4 {
    font-size: 11px;
    margin: 0 0 6px;
    color: #8fb3d1;
  }

  .ai-summary-columns ul {
    margin: 0;
    padding-left: 16px;
    font-size: 12px;
    color: #cfe3f2;
    line-height: 1.6;
  }

  .ai-summary-columns .pontos-fortes h4 { color: rgba(110, 230, 180, 0.9); }
  .ai-summary-columns .pontos-fracos h4 { color: rgba(255, 150, 150, 0.85); }

  @media (max-width: 480px) {
    .ai-summary-columns {
      grid-template-columns: 1fr;
      gap: 14px;
    }
  }

  .review-card {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .review-card:last-child {
    border-bottom: none;
  }

  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .review-author {
    font-size: 12px;
    font-weight: 600;
    color: #eaf6ff;
  }

  .review-rating {
    font-size: 11px;
    color: #ffd76a;
  }

  .review-time {
    font-size: 10.5px;
    color: #7a94a8;
  }

  .review-text {
    font-size: 12px;
    color: #cfe3f2;
    line-height: 1.5;
    margin: 0;
  }

  .avaliacoes-nota {
    font-size: 10.5px;
    color: #7a94a8;
    margin: -6px 0 12px;
  }
</style>
</head>
<body>

<div id="overlay">
  <div id="card">
    <p id="logo">ÍCARO</p>
    <p id="subtitle">Score do Prestador</p>

    <label id="cnpj-label" for="cnpj-input">CNPJ</label>
    <input
      id="cnpj-input"
      type="text"
      inputmode="numeric"
      placeholder="00.000.000/0000-00"
      maxlength="18"
      autocomplete="off"
    />
    <div id="feedback"></div>

    <button id="search-btn" type="button" disabled>Buscar</button>

    <div id="loading">
      <div class="spinner"></div>
      <span>Consultando bases de dados...</span>
    </div>

    <div id="results"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
  // ============ CENA / CÂMERA / RENDER ============
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 3.2;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const EARTH_RADIUS = 1;

  // ============ LUZES ============
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
  sunLight.position.set(5, 2, 4);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x223344, 0.9));

  // ============ GRUPO DO MUNDO ============
  const worldGroup = new THREE.Group();
  worldGroup.rotation.z = THREE.MathUtils.degToRad(-8);
  scene.add(worldGroup);

  // ============ TEXTURAS REALISTAS ============
  const loader = new THREE.TextureLoader();
  const base = "https://threejs.org/examples/textures/planets/";
  const earthMap    = loader.load(base + "earth_atmos_2048.jpg");
  const earthNormal = loader.load(base + "earth_normal_2048.jpg");
  const earthSpec   = loader.load(base + "earth_specular_2048.jpg");
  const cloudsMap   = loader.load(base + "earth_clouds_1024.png");
  const lightsMap   = loader.load(base + "earth_lights_2048.png");

  // ============ TERRA ============
  const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthMap,
    normalMap: earthNormal,
    normalScale: new THREE.Vector2(0.8, 0.8),
    specularMap: earthSpec,
    specular: new THREE.Color(0x333333),
    shininess: 15,
    emissiveMap: lightsMap,
    emissive: new THREE.Color(0xffcc88),
    emissiveIntensity: 0.55
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  worldGroup.add(earth);

  // ============ NUVENS ============
  const cloudsGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.008, 96, 96);
  const cloudsMaterial = new THREE.MeshPhongMaterial({
    map: cloudsMap,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
  });
  const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
  worldGroup.add(clouds);

  // ============ ATMOSFERA SUTIL ============
  const atmosphereGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.04, 96, 96);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      glowColor: { value: new THREE.Color(0x3a7bd5) }
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      uniform vec3 glowColor;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
        gl_FragColor = vec4(glowColor, intensity * 0.9);
      }
    `
  });
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  scene.add(atmosphere);

  // ============ ESTRELAS ============
  function createStars() {
    const group = new THREE.Group();
    for (let layer = 0; layer < 3; layer++) {
      const geo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 40 + Math.random() * 40;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(p) * Math.cos(t);
        positions[i * 3 + 1] = r * Math.cos(p);
        positions[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      }
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.05 + layer * 0.05,
        transparent: true,
        opacity: 0.4 + layer * 0.25
      });
      group.add(new THREE.Points(geo, mat));
    }
    return group;
  }
  scene.add(createStars());

  // ============ RESPONSIVIDADE ============
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ ANIMAÇÃO ============
  function animate() {
    requestAnimationFrame(animate);
    worldGroup.rotation.y += 0.0012;
    clouds.rotation.y += 0.0004;
    renderer.render(scene, camera);
  }
  animate();
</script>

<script>
  // ============ FORMULÁRIO DE CNPJ ============
  const input = document.getElementById("cnpj-input");
  const feedback = document.getElementById("feedback");
  const button = document.getElementById("search-btn");

  // aplica a máscara 00.000.000/0000-00 enquanto o usuário digita
  function maskCNPJ(value) {
    const digits = value.replace(/\D/g, "").slice(0, 14);
    let masked = digits;

    masked = masked.replace(/^(\d{2})(\d)/, "$1.$2");
    masked = masked.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
    masked = masked.replace(/^(\d{2})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3/$4");
    masked = masked.replace(/^(\d{2})\.(\d{3})\.(\d{3})\/(\d{4})(\d)/, "$1.$2.$3/$4-$5");

    return masked;
  }

  // valida os dígitos verificadores do CNPJ (algoritmo módulo 11 oficial)
  function isValidCNPJ(rawValue) {
    const cnpj = rawValue.replace(/\D/g, "");

    if (cnpj.length !== 14) return false;
    if (/^(\d)\1{13}$/.test(cnpj)) return false; // rejeita sequências tipo 11111111111111

    const calcCheckDigit = (base) => {
      const weights = base.length === 12
        ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
        : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];

      const sum = base
        .split("")
        .reduce((acc, digit, i) => acc + parseInt(digit, 10) * weights[i], 0);

      const remainder = sum % 11;
      return remainder < 2 ? 0 : 11 - remainder;
    };

    const base12 = cnpj.slice(0, 12);
    const digit1 = calcCheckDigit(base12);
    const digit2 = calcCheckDigit(base12 + digit1);

    return cnpj === base12 + String(digit1) + String(digit2);
  }

  function updateState() {
    const raw = input.value.replace(/\D/g, "");

    if (raw.length === 0) {
      feedback.textContent = "";
      feedback.classList.remove("ok");
      input.classList.remove("valid", "invalid");
      setButtonEnabled(false);
      return;
    }

    if (raw.length < 14) {
      feedback.textContent = "CNPJ incompleto";
      feedback.classList.remove("ok");
      input.classList.remove("valid");
      input.classList.add("invalid");
      setButtonEnabled(false);
      return;
    }

    if (isValidCNPJ(raw)) {
      feedback.textContent = "CNPJ válido";
      feedback.classList.add("ok");
      input.classList.remove("invalid");
      input.classList.add("valid");
      setButtonEnabled(true);
    } else {
      feedback.textContent = "CNPJ inválido";
      feedback.classList.remove("ok");
      input.classList.remove("valid");
      input.classList.add("invalid");
      setButtonEnabled(false);
    }
  }

  function setButtonEnabled(enabled) {
    button.disabled = !enabled;
    button.classList.toggle("enabled", enabled);
  }

  input.addEventListener("input", (e) => {
    const cursorAtEnd = e.target.selectionStart === e.target.value.length;
    e.target.value = maskCNPJ(e.target.value);
    if (cursorAtEnd) {
      e.target.selectionStart = e.target.selectionEnd = e.target.value.length;
    }
    updateState();
  });

  // ============ CONFIGURAÇÃO DO BACKEND ============
  // Troque pela URL do seu serviço no Render depois do deploy, ex.:
  // const API_BASE_URL = "https://icaro-backend.onrender.com";
  const API_BASE_URL = "https://prestador-backend.onrender.com";

  const loadingEl = document.getElementById("loading");
  const resultsEl = document.getElementById("results");

  button.addEventListener("click", async () => {
    if (button.disabled) return;

    const cnpjDigits = input.value.replace(/\D/g, "");

    resultsEl.classList.remove("visible");
    resultsEl.innerHTML = "";
    loadingEl.classList.add("visible");
    setButtonEnabled(false);

    const [minhaReceita, brasilApi] = await Promise.allSettled([
      fetchMinhaReceita(cnpjDigits),
      fetchBrasilAPI(cnpjDigits)
    ]);

    loadingEl.classList.remove("visible");
    setButtonEnabled(true);

    const merged = renderResults(minhaReceita, brasilApi);

    // só busca no Google se a atividade principal do CNPJ for da área de odontologia —
    // evita que o usuário pesquise CNPJs de qualquer outro ramo neste app
    const ehOdontologico = /odont/i.test(merged.atividadePrincipal || "");

    if (!ehOdontologico) {
      mostrarBlocoNaoOdontologico();
    } else if (merged.nomeParaBusca && merged.enderecoParaBusca) {
      await buscarGooglePlaces(merged.nomeParaBusca, merged.enderecoParaBusca);
    }
  });

  function mostrarBlocoNaoOdontologico() {
    const bloco = document.createElement("div");
    bloco.className = "google-block";
    bloco.innerHTML = `
      <p class="source-title error">CNPJ fora do escopo</p>
      <p class="error-text">
        Este CNPJ não pertence a um prestador odontológico. Este sistema é destinado
        exclusivamente à consulta de prestadores da área de odontologia — informe um
        novo CNPJ.
      </p>
    `;
    resultsEl.appendChild(bloco);
  }

  async function buscarGooglePlaces(nome, endereco) {
    const googleBlock = document.createElement("div");
    googleBlock.className = "google-block";
    googleBlock.innerHTML = `<p class="source-title">Google Maps</p><p class="error-text" style="color:#8fb3d1;">Buscando dados do Google...</p>`;
    resultsEl.appendChild(googleBlock);

    try {
      const url = `${API_BASE_URL}/api/google-places?nome=${encodeURIComponent(nome)}&endereco=${encodeURIComponent(endereco)}`;
      const response = await fetch(url);
      const data = await response.json();

      if (!response.ok || !data.encontrado) {
        throw new Error(data.error || "Estabelecimento não encontrado no Google.");
      }

      renderGoogleBlock(googleBlock, data);
    } catch (err) {
      console.error("Erro na busca do Google Places:", err);
      googleBlock.innerHTML = `
        <p class="source-title error">Google Maps</p>
        <p class="error-text">Não foi possível encontrar este estabelecimento no Google Maps.</p>
        <p class="error-text" style="opacity:0.7; margin-top:4px;">Detalhe: ${err.message}</p>
      `;
    }
  }

  function renderGoogleBlock(container, data) {
    let openBadge = "";
    if (data.abertoAgora === true) openBadge = `<span class="open-badge open">Aberto agora</span>`;
    else if (data.abertoAgora === false) openBadge = `<span class="open-badge closed">Fechado agora</span>`;

    const hoursHtml = buildHoursList(data.horarioFuncionamento);

    const transporteBadge = (icon, valor, label) => {
      const count = valor === null ? "—" : valor;
      return `<span class="transport-badge">${icon} ${label}: <span class="count">${count}</span></span>`;
    };

    const photosHtml = data.fotos?.length
      ? `
        <p class="transport-title">Fotos dos clientes (${data.fotos.length})</p>
        <div class="photos-grid">
          ${data.fotos.map((f, i) => `
            <div class="photo-card">
              <a href="${API_BASE_URL}${f.url}&maxwidth=1200" target="_blank" rel="noopener">
                <img data-photo-index="${i}" src="${API_BASE_URL}${f.url}" loading="lazy" alt="Foto do estabelecimento" />
              </a>
              ${f.parte ? `<span class="photo-tag">${f.parte}</span>` : ""}
              ${f.resumo ? `<p class="photo-caption">${f.resumo}</p>` : ""}
            </div>
          `).join("")}
        </div>
      `
      : `
        <p class="transport-title">Fotos dos clientes</p>
        <p class="error-text" style="color:#8fb3d1;">
          A API do Google não disponibilizou fotos para este estabelecimento.
          ${data.linkGoogleMaps ? `<a href="${data.linkGoogleMaps}" target="_blank" rel="noopener" style="color:#7fc4ff;">Ver no Google Maps →</a>` : ""}
        </p>
      `;

    const avaliacoesHtml = buildAvaliacoesHtml(data.avaliacoes, data.resumoAvaliacoes, data.nota, data.totalAvaliacoes);

    container.innerHTML = `
      <p class="source-title">Google Maps</p>
      <p class="google-match">Encontrado como: <strong>${data.nome}</strong> — ${data.enderecoFormatado}</p>
      ${openBadge ? `<div class="rating-row">${openBadge}</div>` : ""}
      ${hoursHtml}
      <p class="transport-title">Transporte próximo</p>
      <div class="transport-row">
        ${transporteBadge("🚌", data.transporte.pontosOnibus, "Ônibus")}
        ${transporteBadge("🚆", data.transporte.estacoesTrem, "Trem")}
        ${transporteBadge("🚇", data.transporte.estacoesMetro, "Metrô")}
      </div>
      ${buildAccessibilityBadges(data.acessibilidade)}
      ${photosHtml}
      ${avaliacoesHtml}
    `;

    container.querySelectorAll(".photos-grid img").forEach((img) => {
      img.addEventListener("error", () => {
        console.error("Falha ao carregar foto:", img.src);
        const placeholder = document.createElement("span");
        placeholder.className = "photo-error";
        placeholder.textContent = "Falha ao carregar";
        img.replaceWith(placeholder);
      });
    });
  }

  // monta o resumo da IA (se disponível) + a lista de comentários das avaliações
  function buildAvaliacoesHtml(avaliacoes, resumo, nota, totalAvaliacoes) {
    const notaFormatada = nota != null ? nota.toFixed(1) : "—";
    const totalTexto = totalAvaliacoes != null ? `${totalAvaliacoes} avaliações` : "sem avaliações";
    const notaHtml = `
      <div class="rating-row" style="margin-bottom: 12px;">
        <span class="rating-score">${notaFormatada} ★</span>
        <span class="rating-count">${totalTexto}</span>
      </div>
    `;

    if (!avaliacoes?.length) {
      return `
        <p class="transport-title">Avaliações dos clientes</p>
        ${notaHtml}
        <p class="error-text" style="color:#8fb3d1;">Nenhuma avaliação com comentário disponível.</p>
      `;
    }

    const resumoHtml = resumo
      ? `
        <div class="ai-summary-box">
          <p class="ai-summary-label">✨ Resumo gerado por IA</p>
          <p class="ai-summary-text">${resumo.resumoGeral || ""}</p>
          <div class="ai-summary-columns">
            <div class="pontos-fortes">
              <h4>👍 Pontos fortes</h4>
              <ul>${(resumo.pontosFortes || []).map((p) => `<li>${p}</li>`).join("") || "<li>—</li>"}</ul>
            </div>
            <div class="pontos-fracos">
              <h4>👎 Pontos fracos</h4>
              <ul>${(resumo.pontosFracos || []).map((p) => `<li>${p}</li>`).join("") || "<li>—</li>"}</ul>
            </div>
          </div>
        </div>
      `
      : "";

    const comentariosHtml = avaliacoes.map((a) => `
      <div class="review-card">
        <div class="review-header">
          <span class="review-author">${a.autor}</span>
          <span class="review-time">${a.tempo || ""}</span>
        </div>
        <div class="review-rating">${"★".repeat(a.nota || 0)}${"☆".repeat(5 - (a.nota || 0))}</div>
        <p class="review-text">${a.texto || "(sem comentário escrito)"}</p>
      </div>
    `).join("");

    return `
      <p class="transport-title">Avaliações dos clientes</p>
      ${notaHtml}
      <p class="avaliacoes-nota">Análise baseada nas até 5 avaliações mais relevantes disponibilizadas pelo Google (não é o total de avaliações do local).</p>
      ${resumoHtml}
      ${comentariosHtml}
    `;
  }

  // monta a lista de horários em linhas alinhadas (dia à esquerda, horário à direita),
  // destacando o dia de hoje
  // monta os badges de acessibilidade: sim (verde), não (vermelho) ou não informado (neutro)
  function buildAccessibilityBadges(acessibilidade) {
    const itens = [
      ["♿", acessibilidade.entradaAcessivel, "Entrada"],
      ["🅿️", acessibilidade.estacionamentoAcessivel, "Estacionamento"],
      ["🚻", acessibilidade.banheiroAcessivel, "Banheiro"],
      ["💺", acessibilidade.assentosAcessiveis, "Assentos"]
    ];

    const badges = itens.map(([icon, valor, label]) => {
      let statusClass, statusText;
      if (valor === true) { statusClass = "yes"; statusText = "Sim"; }
      else if (valor === false) { statusClass = "no"; statusText = "Não"; }
      else { statusClass = "unknown"; statusText = "Não informado"; }

      return `<span class="accessibility-badge ${statusClass}">${icon} ${label}: <strong>${statusText}</strong></span>`;
    }).join("");

    return `
      <p class="transport-title">Acessibilidade</p>
      <div class="transport-row">${badges}</div>
    `;
  }

  function buildHoursList(weekdayDescriptions) {
    if (!weekdayDescriptions?.length) {
      return `<p class="error-text" style="color:#8fb3d1;">Horário não informado</p>`;
    }

    // weekdayDescriptions vem na ordem segunda(0) ... domingo(6); getDay() retorna domingo(0) ... sábado(6)
    const todayIndex = (new Date().getDay() + 6) % 7;

    const rows = weekdayDescriptions.map((line, i) => {
      const match = line.match(/^([^:]+):\s*(.*)$/);
      const dayName = match ? match[1] : line;
      const hours = match ? match[2] : "";
      const isClosed = /fechado/i.test(hours) || hours === "";
      const isToday = i === todayIndex;

      return `
        <li class="${isToday ? "today" : ""}">
          <span class="day-name">${dayName}</span>
          <span class="day-hours ${isClosed ? "closed-text" : ""}">${hours || "Fechado"}</span>
        </li>
      `;
    }).join("");

    return `
      <p class="hours-title">Horário de funcionamento</p>
      <ul class="hours-list">${rows}</ul>
    `;
  }

  async function fetchMinhaReceita(cnpj) {
    const response = await fetch(`${API_BASE_URL}/api/minha-receita/${cnpj}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  async function fetchBrasilAPI(cnpj) {
    const response = await fetch(`${API_BASE_URL}/api/brasil-api/${cnpj}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function renderResults(minhaReceitaResult, brasilApiResult) {
    const mr = minhaReceitaResult.status === "fulfilled" ? normalizeMinhaReceita(minhaReceitaResult.value) : {};
    const ba = brasilApiResult.status === "fulfilled" ? normalizeBrasilAPI(brasilApiResult.value) : {};

    // pega o primeiro valor não vazio entre as duas fontes, nessa ordem de prioridade
    const pick = (key) => {
      const v1 = mr[key];
      const v2 = ba[key];
      if (v1 !== undefined && v1 !== null && String(v1).trim() !== "") return v1;
      if (v2 !== undefined && v2 !== null && String(v2).trim() !== "") return v2;
      return "Não localizado";
    };

    const fields = [
      ["Razão social", pick("razaoSocial")],
      ["Nome fantasia", pick("nomeFantasia")],
      ["Situação cadastral", pick("situacaoCadastral")],
      ["Atividade principal", pick("atividadePrincipal")],
      ["Endereço", pick("endereco")],
      ["CEP", formatCEP(pick("cep"))],
      ["Telefone", formatPhone(pick("telefone"))],
      ["E-mail", pick("email")]
    ];

    resultsEl.innerHTML = "";

    const block = document.createElement("div");
    block.className = "source-block";

    fields.forEach(([label, value]) => {
      const row = document.createElement("div");
      row.className = "data-row";
      row.innerHTML = `
        <span class="data-label">${label}</span>
        <span class="data-value">${value}</span>
      `;
      block.appendChild(row);
    });

    resultsEl.appendChild(block);
    resultsEl.classList.add("visible");

    return {
      nomeParaBusca: fields[1][1] !== "Não localizado" ? fields[1][1] : fields[0][1], // prefere nome fantasia, cai pro razão social
      enderecoParaBusca: fields[4][1] !== "Não localizado" ? fields[4][1].replace(/·/g, ",") : "",
      atividadePrincipal: fields[3][1]
    };
  }

  // organiza os campos que vêm da API MinhaReceita em um formato comum
  function normalizeMinhaReceita(d) {
    return {
      razaoSocial: d.razao_social,
      nomeFantasia: d.nome_fantasia,
      situacaoCadastral: d.descricao_situacao_cadastral,
      atividadePrincipal: d.cnae_fiscal_descricao,
      endereco: formatEndereco(d.logradouro, d.numero, d.municipio, d.uf),
      cep: d.cep,
      telefone: d.ddd_telefone_1,
      email: d.email
    };
  }

  // organiza os campos que vêm da BrasilAPI em um formato comum
  function normalizeBrasilAPI(d) {
    return {
      razaoSocial: d.razao_social,
      nomeFantasia: d.nome_fantasia,
      situacaoCadastral: d.descricao_situacao_cadastral,
      atividadePrincipal: d.cnae_fiscal_descricao,
      endereco: formatEndereco(d.logradouro, d.numero, d.municipio, d.uf),
      cep: d.cep,
      telefone: d.ddd_telefone_1,
      email: d.email
    };
  }

  function formatEndereco(logradouro, numero, municipio, uf) {
    const parts = [
      [logradouro, numero].filter(Boolean).join(", "),
      [municipio, uf].filter(Boolean).join(" - ")
    ].filter(Boolean);
    return parts.join(" · ");
  }

  // formata CEP como 00000-000
  function formatCEP(value) {
    if (!value || value === "Não localizado") return value;
    const digits = String(value).replace(/\D/g, "");
    if (digits.length !== 8) return value;
    return `${digits.slice(0, 5)}-${digits.slice(5)}`;
  }

  // formata telefone como (XX)XXXXX-XXXX (celular, 11 dígitos)
  // ou (XX)XXXX-XXXX (fixo, 10 dígitos)
  function formatPhone(value) {
    if (!value || value === "Não localizado") return value;
    const digits = String(value).replace(/\D/g, "");

    if (digits.length === 11) {
      return `(${digits.slice(0, 2)})${digits.slice(2, 7)}-${digits.slice(7)}`;
    }
    if (digits.length === 10) {
      return `(${digits.slice(0, 2)})${digits.slice(2, 6)}-${digits.slice(6)}`;
    }
    return value;
  }
</script>
