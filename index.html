<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ÍCARO</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000005;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  canvas {
    display: block;
  }

  /* ============ OVERLAY CENTRAL ============ */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none; /* deixa o globo "respirar" atrás, só o card recebe clique */
  }

  #card {
    pointer-events: auto;
    width: min(90vw, 460px);
    max-height: 86vh;
    overflow-y: auto;
    padding: 40px 36px 34px;
    border-radius: 18px;
    background: rgba(8, 16, 28, 0.55);
    border: 1px solid rgba(127, 196, 255, 0.25);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 0 40px rgba(58, 123, 213, 0.15),
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    text-align: center;
    scrollbar-width: thin;
    scrollbar-color: rgba(127, 196, 255, 0.35) transparent;
  }

  #card::-webkit-scrollbar {
    width: 6px;
  }
  #card::-webkit-scrollbar-thumb {
    background: rgba(127, 196, 255, 0.35);
    border-radius: 3px;
  }

  #logo {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #eaf6ff;
    margin: 0 0 4px;
    text-shadow: 0 0 18px rgba(127, 196, 255, 0.55);
  }

  #subtitle {
    font-size: 12.5px;
    letter-spacing: 1.5px;
    color: #7fa8c9;
    margin: 0 0 30px;
    text-transform: uppercase;
  }

  #cnpj-label {
    display: block;
    text-align: left;
    font-size: 12.5px;
    color: #9fc3dd;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  #cnpj-input {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-radius: 10px;
    border: 1px solid rgba(127, 196, 255, 0.3);
    background: rgba(255, 255, 255, 0.04);
    color: #eaf6ff;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  #cnpj-input::placeholder {
    color: rgba(200, 225, 245, 0.35);
  }

  #cnpj-input:focus {
    border-color: rgba(127, 196, 255, 0.7);
    box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.2);
  }

  #cnpj-input.invalid {
    border-color: rgba(255, 99, 99, 0.6);
  }

  #cnpj-input.valid {
    border-color: rgba(110, 230, 180, 0.7);
  }

  #feedback {
    min-height: 18px;
    font-size: 12px;
    margin-top: 8px;
    text-align: left;
    color: rgba(255, 120, 120, 0.85);
    transition: color 0.2s ease;
  }

  #feedback.ok {
    color: rgba(110, 230, 180, 0.85);
  }

  #search-btn {
    width: 100%;
    margin-top: 22px;
    padding: 13px 14px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 10px;
    border: none;
    cursor: not-allowed;
    color: rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.06);
    transition: all 0.3s ease;
  }

  #search-btn.enabled {
    cursor: pointer;
    color: #04141f;
    background: linear-gradient(135deg, #7fc4ff, #3a7bd5);
    box-shadow: 0 0 22px rgba(58, 123, 213, 0.55);
  }

  #search-btn.enabled:hover {
    filter: brightness(1.08);
    box-shadow: 0 0 30px rgba(58, 123, 213, 0.75);
  }

  #search-btn.enabled:active {
    transform: scale(0.98);
  }

  /* ============ RESULTADOS ============ */
  #results {
    margin-top: 26px;
    text-align: left;
    display: none;
  }

  #results.visible {
    display: block;
  }

  #loading {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    font-size: 13px;
    color: #9fc3dd;
  }

  #loading.visible {
    display: flex;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(127, 196, 255, 0.25);
    border-top-color: #7fc4ff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .source-block {
    margin-bottom: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(127, 196, 255, 0.15);
  }

  .source-block:last-child {
    margin-bottom: 0;
  }

  .source-title {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #7fc4ff;
    margin: 0 0 10px;
  }

  .source-title.error {
    color: rgba(255, 120, 120, 0.85);
  }

  .data-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .data-row:last-child {
    border-bottom: none;
  }

  .data-label {
    color: #8fb3d1;
    white-space: nowrap;
  }

  .data-value {
    color: #eaf6ff;
    text-align: right;
    word-break: break-word;
  }

  .error-text {
    font-size: 12.5px;
    color: rgba(255, 150, 150, 0.85);
  }
</style>
</head>
<body>

<div id="overlay">
  <div id="card">
    <p id="logo">ÍCARO</p>
    <p id="subtitle">Score do Prestador</p>

    <label id="cnpj-label" for="cnpj-input">CNPJ</label>
    <input
      id="cnpj-input"
      type="text"
      inputmode="numeric"
      placeholder="00.000.000/0000-00"
      maxlength="18"
      autocomplete="off"
    />
    <div id="feedback"></div>

    <button id="search-btn" type="button" disabled>Buscar</button>

    <div id="loading">
      <div class="spinner"></div>
      <span>Consultando bases de dados...</span>
    </div>

    <div id="results"></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
<script>
  // ============ CENA / CÂMERA / RENDER ============
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 3.2;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const EARTH_RADIUS = 1;

  // ============ LUZES ============
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
  sunLight.position.set(5, 2, 4);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x223344, 0.9));

  // ============ GRUPO DO MUNDO ============
  const worldGroup = new THREE.Group();
  worldGroup.rotation.z = THREE.MathUtils.degToRad(-8);
  scene.add(worldGroup);

  // ============ TEXTURAS REALISTAS ============
  const loader = new THREE.TextureLoader();
  const base = "https://threejs.org/examples/textures/planets/";
  const earthMap    = loader.load(base + "earth_atmos_2048.jpg");
  const earthNormal = loader.load(base + "earth_normal_2048.jpg");
  const earthSpec   = loader.load(base + "earth_specular_2048.jpg");
  const cloudsMap   = loader.load(base + "earth_clouds_1024.png");
  const lightsMap   = loader.load(base + "earth_lights_2048.png");

  // ============ TERRA ============
  const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthMap,
    normalMap: earthNormal,
    normalScale: new THREE.Vector2(0.8, 0.8),
    specularMap: earthSpec,
    specular: new THREE.Color(0x333333),
    shininess: 15,
    emissiveMap: lightsMap,
    emissive: new THREE.Color(0xffcc88),
    emissiveIntensity: 0.55
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  worldGroup.add(earth);

  // ============ NUVENS ============
  const cloudsGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.008, 96, 96);
  const cloudsMaterial = new THREE.MeshPhongMaterial({
    map: cloudsMap,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
  });
  const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
  worldGroup.add(clouds);

  // ============ ATMOSFERA SUTIL ============
  const atmosphereGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.04, 96, 96);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      glowColor: { value: new THREE.Color(0x3a7bd5) }
    },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      uniform vec3 glowColor;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
        gl_FragColor = vec4(glowColor, intensity * 0.9);
      }
    `
  });
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  scene.add(atmosphere);

  // ============ ESTRELAS ============
  function createStars() {
    const group = new THREE.Group();
    for (let layer = 0; layer < 3; layer++) {
      const geo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 40 + Math.random() * 40;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(p) * Math.cos(t);
        positions[i * 3 + 1] = r * Math.cos(p);
        positions[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      }
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.05 + layer * 0.05,
        transparent: true,
        opacity: 0.4 + layer * 0.25
      });
      group.add(new THREE.Points(geo, mat));
    }
    return group;
  }
  scene.add(createStars());

  // ============ RESPONSIVIDADE ============
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ ANIMAÇÃO ============
  function animate() {
    requestAnimationFrame(animate);
    worldGroup.rotation.y += 0.0012;
    clouds.rotation.y += 0.0004;
    renderer.render(scene, camera);
  }
  animate();
</script>

<script>
  // ============ FORMULÁRIO DE CNPJ ============
  const input = document.getElementById("cnpj-input");
  const feedback = document.getElementById("feedback");
  const button = document.getElementById("search-btn");

  // aplica a máscara 00.000.000/0000-00 enquanto o usuário digita
  function maskCNPJ(value) {
    const digits = value.replace(/\D/g, "").slice(0, 14);
    let masked = digits;

    masked = masked.replace(/^(\d{2})(\d)/, "$1.$2");
    masked = masked.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
    masked = masked.replace(/^(\d{2})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3/$4");
    masked = masked.replace(/^(\d{2})\.(\d{3})\.(\d{3})\/(\d{4})(\d)/, "$1.$2.$3/$4-$5");

    return masked;
  }

  // valida os dígitos verificadores do CNPJ (algoritmo módulo 11 oficial)
  function isValidCNPJ(rawValue) {
    const cnpj = rawValue.replace(/\D/g, "");

    if (cnpj.length !== 14) return false;
    if (/^(\d)\1{13}$/.test(cnpj)) return false; // rejeita sequências tipo 11111111111111

    const calcCheckDigit = (base) => {
      const weights = base.length === 12
        ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
        : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];

      const sum = base
        .split("")
        .reduce((acc, digit, i) => acc + parseInt(digit, 10) * weights[i], 0);

      const remainder = sum % 11;
      return remainder < 2 ? 0 : 11 - remainder;
    };

    const base12 = cnpj.slice(0, 12);
    const digit1 = calcCheckDigit(base12);
    const digit2 = calcCheckDigit(base12 + digit1);

    return cnpj === base12 + String(digit1) + String(digit2);
  }

  function updateState() {
    const raw = input.value.replace(/\D/g, "");

    if (raw.length === 0) {
      feedback.textContent = "";
      feedback.classList.remove("ok");
      input.classList.remove("valid", "invalid");
      setButtonEnabled(false);
      return;
    }

    if (raw.length < 14) {
      feedback.textContent = "CNPJ incompleto";
      feedback.classList.remove("ok");
      input.classList.remove("valid");
      input.classList.add("invalid");
      setButtonEnabled(false);
      return;
    }

    if (isValidCNPJ(raw)) {
      feedback.textContent = "CNPJ válido";
      feedback.classList.add("ok");
      input.classList.remove("invalid");
      input.classList.add("valid");
      setButtonEnabled(true);
    } else {
      feedback.textContent = "CNPJ inválido";
      feedback.classList.remove("ok");
      input.classList.remove("valid");
      input.classList.add("invalid");
      setButtonEnabled(false);
    }
  }

  function setButtonEnabled(enabled) {
    button.disabled = !enabled;
    button.classList.toggle("enabled", enabled);
  }

  input.addEventListener("input", (e) => {
    const cursorAtEnd = e.target.selectionStart === e.target.value.length;
    e.target.value = maskCNPJ(e.target.value);
    if (cursorAtEnd) {
      e.target.selectionStart = e.target.selectionEnd = e.target.value.length;
    }
    updateState();
  });

  // ============ CONFIGURAÇÃO DO BACKEND ============
  // Troque pela URL do seu serviço no Render depois do deploy, ex.:
  // const API_BASE_URL = "https://icaro-backend.onrender.com";
  const API_BASE_URL = "https://prestador-backend.onrender.com";

  const loadingEl = document.getElementById("loading");
  const resultsEl = document.getElementById("results");

  button.addEventListener("click", async () => {
    if (button.disabled) return;

    const cnpjDigits = input.value.replace(/\D/g, "");

    resultsEl.classList.remove("visible");
    resultsEl.innerHTML = "";
    loadingEl.classList.add("visible");
    setButtonEnabled(false);

    const [minhaReceita, brasilApi] = await Promise.allSettled([
      fetchMinhaReceita(cnpjDigits),
      fetchBrasilAPI(cnpjDigits)
    ]);

    loadingEl.classList.remove("visible");
    setButtonEnabled(true);

    renderResults(minhaReceita, brasilApi);
  });

  async function fetchMinhaReceita(cnpj) {
    const response = await fetch(`${API_BASE_URL}/api/minha-receita/${cnpj}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  async function fetchBrasilAPI(cnpj) {
    const response = await fetch(`${API_BASE_URL}/api/brasil-api/${cnpj}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function renderResults(minhaReceita, brasilApi) {
    resultsEl.innerHTML = "";
    resultsEl.appendChild(buildSourceBlock("MinhaReceita", minhaReceita, normalizeMinhaReceita));
    resultsEl.appendChild(buildSourceBlock("BrasilAPI", brasilApi, normalizeBrasilAPI));
    resultsEl.classList.add("visible");
  }

  function buildSourceBlock(title, settledResult, normalizeFn) {
    const block = document.createElement("div");
    block.className = "source-block";

    if (settledResult.status === "rejected") {
      block.innerHTML = `
        <p class="source-title error">${title}</p>
        <p class="error-text">Não foi possível consultar esta fonte agora.</p>
      `;
      return block;
    }

    const data = normalizeFn(settledResult.value);
    const titleEl = document.createElement("p");
    titleEl.className = "source-title";
    titleEl.textContent = title;
    block.appendChild(titleEl);

    data.forEach(([label, value]) => {
      if (!value) return;
      const row = document.createElement("div");
      row.className = "data-row";
      row.innerHTML = `
        <span class="data-label">${label}</span>
        <span class="data-value">${value}</span>
      `;
      block.appendChild(row);
    });

    return block;
  }

  // organiza os campos que vêm da API MinhaReceita
  function normalizeMinhaReceita(d) {
    return [
      ["Razão social", d.razao_social],
      ["Nome fantasia", d.nome_fantasia],
      ["Situação cadastral", d.descricao_situacao_cadastral],
      ["Atividade principal", d.cnae_fiscal_descricao],
      ["Porte", d.porte?.descricao || d.descricao_porte],
      ["Endereço", formatEndereco(d.logradouro, d.numero, d.municipio, d.uf)],
      ["CEP", d.cep],
      ["Telefone", d.ddd_telefone_1]
    ];
  }

  // organiza os campos que vêm da BrasilAPI
  function normalizeBrasilAPI(d) {
    return [
      ["Razão social", d.razao_social],
      ["Nome fantasia", d.nome_fantasia],
      ["Situação cadastral", d.descricao_situacao_cadastral],
      ["Atividade principal", d.cnae_fiscal_descricao],
      ["Porte", d.descricao_porte],
      ["Endereço", formatEndereco(d.logradouro, d.numero, d.municipio, d.uf)],
      ["CEP", d.cep],
      ["Telefone", d.ddd_telefone_1]
    ];
  }

  function formatEndereco(logradouro, numero, municipio, uf) {
    const parts = [
      [logradouro, numero].filter(Boolean).join(", "),
      [municipio, uf].filter(Boolean).join(" - ")
    ].filter(Boolean);
    return parts.join(" · ");
  }
</script>

</body>
</html>
